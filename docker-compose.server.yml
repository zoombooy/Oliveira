services:
  postgres:
    image: ghcr.io/jonathanmcohen/pgvector:16-0.8.3
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro,Z

  api:
    build:
      dockerfile: Dockerfile.offline
      args:
        PYTHON_IMAGE: python:3.12-slim

  worker:
    build:
      dockerfile: Dockerfile.offline
      args:
        PYTHON_IMAGE: python:3.12-slim

  frontend:
    build:
      dockerfile: Dockerfile.static
      args:
        NODE_IMAGE: node:22-bookworm
    ports:
      - "${FRONTEND_PORT:-5173}:80"
