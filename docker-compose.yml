services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oliveira
      POSTGRES_PASSWORD: oliveira
      POSTGRES_DB: oliveira
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oliveira -d oliveira"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://oliveira:oliveira@postgres:5432/oliveira
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      CHUNK_SIZE: ${CHUNK_SIZE:-500}
      CHUNK_OVERLAP: ${CHUNK_OVERLAP:-50}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-8}
      VECTOR_WEIGHT: ${VECTOR_WEIGHT:-0.7}
      KEYWORD_WEIGHT: ${KEYWORD_WEIGHT:-0.3}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      OLIVEIRA_MASTER_KEY: ${OLIVEIRA_MASTER_KEY:-change-me-in-development}
      APP_ENV: ${APP_ENV:-development}
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend/data:/app/data

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://oliveira:oliveira@postgres:5432/oliveira
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      OLIVEIRA_MASTER_KEY: ${OLIVEIRA_MASTER_KEY:-change-me-in-development}
      WORKER_ID: ${WORKER_ID:-oliveira-worker}
      TASK_POLL_INTERVAL: ${TASK_POLL_INTERVAL:-1.0}
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  frontend:
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

volumes:
  pgdata:
